<!DOCTYPE html>
<html lang="{{Language}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ExamTitle}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            overflow: hidden;
        }
        .badge {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a4a4a;
        }
        .waiting {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
        }
        h1 { font-weight: 700; font-size: 2.5rem; color: #000; }
        p { font-size: 1rem; color: #5a5a5a; }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #4a4a4a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .status {
            font-size: 0.85rem;
            color: #6a6a6a;
            animation: pulse 2s ease-in-out infinite;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            background: #fff;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="badge">{{UserName}}</div>
    <div class="waiting" id="waiting">
        <h1>{{ExamTitle}}</h1>
        <p id="instructions"></p>
        <div class="loader"></div>
        <div class="status" id="status"></div>
    </div>
    <iframe id="pdf"></iframe>

    <script>
        const LANG = '{{Language}}';
        const MESSAGES = {
            es: {
                instructions: 'Por favor, espere las instrucciones del docente para comenzar el examen',
                status: 'Esperando examen...'
            },
            en: {
                instructions: 'Please wait for the teacher\'s instructions to begin the exam',
                status: 'Waiting for the exam...'
            }
        };
        const strings = MESSAGES[LANG] || MESSAGES.es;
        document.getElementById('instructions').textContent = strings.instructions;
        document.getElementById('status').textContent = strings.status;

        const iframe = document.getElementById('pdf');
        const waiting = document.getElementById('waiting');
        let pollInterval = null;

        iframe.onload = function() {
            if (iframe.src === '' || iframe.src === 'about:blank') return;

            setTimeout(function() {
                if (iframe.contentWindow.length === 1) {
                    iframe.style.display = 'block';
                    waiting.style.display = 'none';
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }, 100);
        };

        function checkForPDF() {
            iframe.src = 'Exam.pdf?t=' + Date.now() + '#toolbar=0&navpanes=0';
        }

        checkForPDF();
        pollInterval = setInterval(checkForPDF, 5000);
    </script>
</body>
</html>
